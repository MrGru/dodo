name: bmad-dev-story
description: >-
  Per-story execution loop for dodo. Picks the next open story from
  sprint-status.yaml, walks agent-execution-loop.md step by step
  (load -> load skill -> code -> test -> per-commit checks -> commit -> update
  sprint-status.yaml), and stops on success / blocked.
version: 2.0.0
stage: Phase 4 (Implementation)
date: 2026-08-03
entry_points:
  agent_invocation: "Implement story <id> from _bmad-output/implementation-artifacts/stories/, following agent-execution-loop.md."
inputs:
  - name: story
    type: string
    description: "The story id to implement (e.g. e3.8). dodo has no automated selector script; pick from AGENT_BRIEF.md's flat index."
    required: false
outputs:
  - path: _bmad-output/implementation-artifacts/sprint-status.yaml
    write: true
  - path: <git working tree>
    write: true # via a normal commit, following this repo's existing message style
gates:
  - id: deps_resolved
    description: "Every dependency listed for the story in sprint-status.yaml is 'done'. In practice dodo's four open stories (E3.8, E4.6, E5.7, E9.4) have none."
  - id: fmt
    description: "cargo fmt --all is clean."
  - id: clippy
    description: "cargo clippy --all-targets --locked -- -D warnings is clean, no new crate-level #[allow]."
  - id: test
    description: "cargo test passes, including the i18n guard tests if user-facing text changed."
  - id: database_self_contained
    description: "If src/database/ was touched: grep -rn '^use crate::' src/database/ | grep -vE 'crate::(database,i18n,app_icon,paths)' returns nothing."
escalation: _bmad-output/implementation-artifacts/blocked-decision-tree.md
related:
  - _bmad-output/implementation-artifacts/agent-execution-loop.md
  - _bmad-output/implementation-artifacts/architecture-constraints.md
  - _bmad-output/implementation-artifacts/AGENT_BRIEF.md
tags: [bmad, implementation, per-story]

# Note: the predecessor of this file (v1.0.0) described a Python-scripted, two-developer
# ("Dev A"/"Dev B") automation pipeline — scripts/bmad/next_story.py, check_constraints.py,
# lint_commit_msg.py, a Cursor slash command, and a 13-item PySide6-specific grep gate. None of
# that tooling, nor a two-developer stream, exists in dodo. This version describes the loop that
# actually applies here: a single agent, cargo-based gates, no selector script.
