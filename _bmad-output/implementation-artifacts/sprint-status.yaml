progress: >
  39 stories across E0-E9. 35 done, 3 placeholder-by-design (E3.8, E4.6, E5.7 — each a stated,
  labeled "coming soon" control, not a defect), 1 open-question (E9.4 — a licensing decision, not
  an engineering task). No story is blocked, in-progress, or backlog as of this audit.

definition_of_done:
  per_story:
    - Every AC bullet in the story dossier verified
    - cargo fmt --all clean
    - cargo clippy --all-targets --locked -- -D warnings clean, no new crate-level #[allow]
    - cargo test passes, including both i18n guard tests if user-facing text changed
    - src/database/ self-containment grep still returns nothing (if touched)
    - No file/network/DB I/O added on the UI thread
    - For a UI-visible change, actually run per dodo-build-validate, not just type-checked
    - Commit follows this repo's existing message style (see git log)
