# Ground-truth status, established 2026-08-03 via direct source audit (an Explore-agent pass over
# src/, cross-checked against CLAUDE.md and each module's own mod.rs doc comments), replacing a
# sprint-status.yaml that tracked ~400 stories for an unrelated project ("Cowork Local v3.0").
#
# Key finding from that audit: README.md UNDERSTATES current functionality — it describes API
# Explorer's Auth/Scripts/Cookies/Tests/Console/collections and Docker's Images/Volumes/Networks as
# "arriving later," but all of these are actually implemented and wired. CLAUDE.md is accurate;
# README.md is stale (see open-questions.md item 3). This file reflects the audited ground truth,
# not README.md's wording.
project: dodo
tracking_system: file-system
story_location: ./stories

# dodo has no sprint cadence, no fixed release date, and no team roster recorded anywhere in the
# repository — there is deliberately no `sprints:` section here (the predecessor project's
# day-by-day hackathon schedule does not translate to anything real for dodo).

