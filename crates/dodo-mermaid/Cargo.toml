[package]
name = "dodo-mermaid"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "dodo's Mermaid rendering service: source in, SVG out, through an embedded Rust renderer."

# `mermaid-rs-renderer` is the whole dependency this crate exists to own.
# `default-features = false` is load-bearing, not a style choice: the crate's
# defaults are `cli` (pulls `clap`) and `png` (pulls `resvg`/`usvg`), neither of
# which dodo wants — SVG is the canonical output here and there is no CLI
# binary to build. Re-check this pair before ever bumping the version; if a
# future release folds `png` into a non-optional path, that is the moment to
# stop and re-measure rather than accept the size silently.
#
# `render.rs` is the pure service layer and stays free of the four below it —
# no `App`, no window, no test needs one. `view.rs` is the GPUI workspace and
# is the only file in this crate allowed to name them, the same split
# `dodo-flow` draws between `models/`/`geometry/` and `views/`.
[dependencies]
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
dodo-app-icon = { path = "../dodo-app-icon" }
dodo-i18n = { path = "../dodo-i18n", features = ["gpui"] }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }

[dev-dependencies]
# The standalone launcher only, exactly as every other feature crate's.
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

[[example]]
name = "mermaid"
path = "examples/mermaid.rs"
