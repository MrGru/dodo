[package]
name = "dodo-json-formatter"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "dodo's JSON formatter tool."

# These are exactly the dependencies the tool used in `src/json_formatter.rs`.
[dependencies]
dodo-i18n = { path = "../dodo-i18n", features = ["gpui"] }
gpui-kit = { package = "gpui-kit", version = "0.6", default-features = false, features = ["component"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# The standalone launcher only. JSON highlighting matches the full app.
gpui-kit = { package = "gpui-kit", version = "0.6", default-features = false, features = [
    "tree-sitter",
] }

[[example]]
name = "json_formatter"
path = "examples/json_formatter.rs"
