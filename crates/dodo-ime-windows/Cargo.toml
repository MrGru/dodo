[package]
name = "dodo-ime-windows"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "dodo's Windows TSF text-service host for dodo-ime-core."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dodo-ime-core = { path = "../dodo-ime-core" }
dodo-ime-ipc = { path = "../dodo-ime-ipc" }

[target.'cfg(windows)'.dependencies]
# `windows-sys` deliberately does not generate COM interface implementations
# for TSF. The checked `windows` bindings do, and this exact version is already
# in Cargo.lock through transitive dependencies.
windows = { version = "0.57", features = [
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[windows_core::implement]` expands to this crate by name. It is already in
# Cargo.lock with the same version as `windows`, so this adds no new package.
windows-core = "0.57"
