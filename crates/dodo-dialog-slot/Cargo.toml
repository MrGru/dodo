[package]
name = "dodo-dialog-slot"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "One dialog at a time: the per-marker slot the dialogs with more than one way in claim and release."

# A *kernel* crate, and the one that had no choice about becoming one. It works
# through a gpui `Global`, and a `Global` is identified by its **type** — so a
# copy on each side of a crate boundary would be two different slots and the
# defect it exists to prevent would come straight back. The moment the updater
# left the binary, both it and `src/settings.rs` had to reach the same one.
# That is the same argument that put `t()` and the active-language global
# inside `dodo-i18n` rather than leaving them in `src/`.
[dependencies]
# `App`, `Global` and `Window`, plus `WindowExt::has_active_dialog` — the one
# question this module asks the window and the only reason the component
# library is named here at all.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }

[dev-dependencies]
# `#[gpui::test]`, for the two tests that play the caller's half of the
# protocol against an `App`. A real dialog stack stays out of reach — see the
# module doc — so this is the whole of what the tests need.
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
