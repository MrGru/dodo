[package]
name = "dodo-app-icon"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The icons dodo draws: one enum naming every SVG under `assets/icons`, resolved to a path the asset source loads."

# Only the two the enum's `IconNamed` impl and `Icon::new` need. This crate
# names no path relative to the repository — `assets/icons/...` is a *logical*
# path the binary's `Assets` source resolves — so it moves without the artwork
# moving.
[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
