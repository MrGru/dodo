[package]
name = "dodo-ime-macos"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "dodo's macOS input method: an InputMethodKit host that drives dodo-ime-core."

# The bundle's executable. `CFBundleExecutable` in
# `scripts/macos-input-method-bundle.sh` names this exact string, and macOS
# launches it by that name — renaming the binary without renaming the plist key
# produces a bundle that installs, appears in the input-source list, and never
# starts.
[[bin]]
name = "DodoVietnamese"
path = "src/main.rs"

[dependencies]
# The engine. This is the only dependency that exists on every platform, and it
# is the reason this crate is a workspace member rather than a standalone crate
# with its own lockfile — see the module docs in `src/lib.rs`.
dodo-ime-core = { path = "../dodo-ime-core" }
# The contract with `Dodo.app`: the identifiers macOS looks this bundle up by
# (re-exported as `crate::bundle`), the two JSON files the two processes
# exchange, and the notification name. Pure, and on every platform for the same
# reason the engine is — everything about the *files* is testable off macOS.
dodo-ime-ipc = { path = "../dodo-ime-ipc" }

# Every Objective-C binding is macOS-only *in the manifest*, not merely behind a
# `#[cfg]` in the source. A plain `[dependencies]` entry would make a Linux or
# Windows `cargo check` — which `.github/workflows/ci.yml` runs on every push —
# resolve and build AppKit bindings for a platform that has no AppKit. Declared
# this way, the non-Apple builds compile the pure half of this crate and nothing
# else.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = [
    "NSString",
    "NSBundle",
    "NSDictionary",
    "NSAttributedString",
    "NSRange",
    "NSArray",
    "NSValue",
] }
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSResponder",
    "NSEvent",
] }
# `IMKInputController` and `IMKServer`. Note that `IMKTextInput` — the *client*
# side, which is where every call that puts text on screen lives — is NOT in
# this crate and cannot be: it is declared in Carbon's HIToolbox, not in
# InputMethodKit. `src/client.rs` is the hand-written façade for it.
objc2-input-method-kit = "0.3.2"

# `CFNotificationCenterAddObserver`, for the one distributed notification dodo
# posts when it has written the settings file. Not a new package — it is already
# `objc2-app-kit`'s own dependency — and it is preferred over
# `NSDistributedNotificationCenter` because its observer is a plain `extern "C"`
# function pointer: no Objective-C class to define and no `block2`. See
# `src/ipc.rs`.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFBase",
    "CFDictionary",
    "CFNotificationCenter",
    "CFString",
] }

# `objc2`'s `exception` feature, for the boundary test alone: it turns an
# Objective-C exception into a `Result` so a failure prints what was raised
# instead of aborting the process with "Rust cannot catch foreign exceptions".
# A dev-dependency, so the shipped bundle never carries the unwinding shims.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = { version = "0.6", features = ["exception"] }

# The Objective-C boundary test owns `main` because `DodoInputController` is
# `MainThreadOnly` and libtest runs every `#[test]` on a spawned thread, where
# `MainThreadMarker::new()` correctly refuses. See the file's own docs.
[[test]]
name = "controller"
path = "tests/controller.rs"
harness = false
