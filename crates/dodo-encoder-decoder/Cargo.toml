[package]
name = "dodo-encoder-decoder"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "dodo's Encoder/Decoder tool."

# These are exactly the dependencies the tool used in `src/encoder_decoder.rs`.
[dependencies]
dodo-i18n = { path = "../dodo-i18n", features = ["gpui"] }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
base64 = "0.22.1"
percent-encoding = "2.3.2"
serde_json = "1.0"

[dev-dependencies]
# The standalone launcher only. JWT JSON highlighting matches the full app.
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = [
    "tree-sitter",
] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

[[example]]
name = "encoder_decoder"
path = "examples/encoder_decoder.rs"
