[package]
name = "dodo-flow"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "dodo's Flow Canvas: the infinite-canvas document model, the world/screen transform, the per-platform render budgets and the canvas view."

# The list is short because this slice is the engine's pure core plus an empty
# themed pane. `lib.rs` explains the phase sequence; the deliberate absences
# are as much a decision as the presences:
#
# - **No `dodo-i18n`, no `dodo-app-icon`.** The canvas shows no user-visible
#   string and draws no icon until the sidebar row wires it into the app.
#   Adding either now would be a dependency with no reason, and this file's whole
#   convention is that every dependency carries its reason.
# - **No `criterion`.** dodo has no bench harness and is deliberate about every
#   package in the graph (`deny.toml`, `THIRD-PARTY-NOTICES.md`). The benchmark
#   is an `examples/flow_bench.rs` printing `Instant` timings.
[dependencies]
# `HostOs`, which `budgets` treats as a *parameter* rather than a `cfg` split,
# so every platform's render ceiling and LOD ladder is asserted from whichever
# platform you are on — the point of the invariant in the root `AGENTS.md`, and
# the reason `budgets::for_host` takes a `HostOs` while `budgets::current()` is
# the one place that reads `cfg!`. Two of dodo's four release targets cannot be
# built from a Mac at all, so an answer expressed as a `#[cfg]` item would be an
# answer nobody here can compile.
dodo-paths = { path = "../dodo-paths" }
# Only the files under `views/` may name these two. `models/` and `geometry/` —
# the document, the taxonomy, the styles, the versioned format and every
# world<->screen formula — are gpui-free on purpose and are unit tested with no
# `App` and no window. That boundary is what makes the engine testable, and
# `lib.rs` records why it is very hard to recover once lost.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
# The versioned document format (`models::serialization`). `serde_json`'s
# `Value` is also the migration ladder's currency: a step rewrites the parsed
# JSON of an older version, so a migration never has to keep a copy of a
# retired Rust struct alive.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# `examples/flow.rs` only: the application runner and the component library's
# fallback icons, exactly as every other feature crate's launcher takes them.
# Keeping both here leaves the shipped app's dependency graph unchanged.
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

[[example]]
name = "flow"
path = "examples/flow.rs"

# The graph engine's numbers. **Release only** — a debug build measures the
# borrow checker's bookkeeping rather than the data structure, and the two
# disagree by more than an order of magnitude. It is what answers §20's
# "benchmark the representation" and what `runtime::adjacency`'s module doc
# quotes; re-run it before changing that table.
[[example]]
name = "flow_graph_bench"
path = "examples/flow_graph_bench.rs"

# **Phase 4's gate.** §38's scenes and §50's questions: viewport query cost at
# 100,000 nodes, one node moved in a 300,000-edge graph, painted vertices
# against the platform ceiling, memory at each scale, and whether a pure pan
# costs anything it should not. Also §21's own instruction to benchmark the
# spatial structure rather than assert it — it builds the same scene through
# the shipping hash grid, a dense array grid and a brute-force scan.
#
# **Release only**, and it says so at the top of its own output: a debug build
# measures the borrow checker rather than the data structure.
[[example]]
name = "flow_scene_bench"
path = "examples/flow_scene_bench.rs"
