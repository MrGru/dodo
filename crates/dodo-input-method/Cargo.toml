[package]
name = "dodo-input-method"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "dodo's Event Tap and Keyboard Hook input methods, their settings, and the tool pane."

# Every dependency below is one the module already had while it was
# `src/input_method/`; nothing was added by the move and nothing was left
# behind. The platform bindings keep the target tables they had in the root
# manifest — which is what lets the pure two thirds of this crate type-check on
# every target while only macOS builds AppKit and only Windows builds Win32.
[dependencies]
# The engine's shared vocabulary and Vietnamese rules. Event Tap and Keyboard
# Hook both drive this same engine directly.
dodo-ime-core = { path = "../dodo-ime-core" }
# Every string the Input method pane and its status banner show. The `gpui`
# feature brings `t()` and the active-language global with it.
dodo-i18n = { path = "../dodo-i18n", features = ["gpui"] }
# `input-method.json` lives under `data_dir()`. `src/paths.rs` here is the seam
# that resolves the host; see its module doc.
dodo-paths = { path = "../dodo-paths" }
# Only `views/` and the `Global` in `lib.rs` may name these. The eighteen files
# under `models/` and the pure half of `services/` are gpui-free on purpose:
# the Event Tap policy, the Windows key-state rebuild, the browser-rewrite
# table, the live-switch rule and the installer plans are all tested with no
# `App` and no frame.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
# The `Send + Sync` sender half that carries a language switch performed inside
# an OS callback back to the state layer, and the `Stream` adaptor `lib.rs`
# awaits the receiver with. A callback has no `App`, which is why the seam is a
# channel; dodo the binary declares the same two lines for `src/tray`.
# **Neither adds a crate to the graph**: `gpui` already depends on both.
futures-channel = "0.3"
futures-util = "0.3.33"
# `input-method.json`; the engine itself deliberately remains serde-free.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# AppKit, CoreFoundation, CoreGraphics and the Objective-C runtime for Event Tap.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# `addObserverForName:object:queue:usingBlock:`, the one form of the workspace
# activation observer that needs no Objective-C class of dodo's own.
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    # `NSBeep`, the Event Tap's language-switch beep. AppKit declares it among
    # the graphics functions rather than beside anything sound-shaped.
    "NSGraphics",
    # The frontmost-application cache the browser-rewrite table is keyed by.
    "NSRunningApplication",
    "NSWorkspace",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "NSDictionary",
    "NSNotification",
    "NSOperation",
    "NSString",
    "block2",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFBase",
    "CFDictionary",
    "CFMachPort",
    "CFRunLoop",
    "CFString",
] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
] }

# The Keyboard Hook. Prefer adding a feature here over
# hand-declaring an `extern "system"` signature — this host cannot compile the
# Windows target, so the signatures need to come from something the Windows
# compiler will check.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # `MessageBeep`, which Windows declares beside the debugging APIs rather
    # than beside the message-box constants it takes.
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
