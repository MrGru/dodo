[package]
name = "update-manifest"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Generates update.json and SHA256SUMS for a dodo release"
# This crate is release engineering, not part of the application. It is never
# published to a registry and never built as part of dodo — the root
# Cargo.toml's `exclude = ["tools/*"]` is what guarantees the second half.
publish = false

# A library plus a thin binary, so every rule below is reachable from a unit
# test. The first draft put the whole pipeline in `main`, which is why its tests
# had to re-implement the artifact-selection loop instead of calling it — a test
# that can pass while the shipped code is wrong.
[lib]
name = "update_manifest"
path = "src/lib.rs"

[[bin]]
name = "update-manifest"
path = "src/main.rs"

# Deliberately four dependencies and no more. `clap`, `anyhow`, `walkdir` and
# `chrono` were all in the first draft and all removed: argument parsing here is
# ten flags, the artifact directory is flat, the errors are strings a human
# reads out of a CI log, and the timestamp is passed through rather than
# computed. `deny.toml` sets `wildcards = "deny"`, so these are real version
# requirements, never "*".
[dependencies]
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.117"
sha2 = "0.10.8"
semver = "1.0.23"
