# `crates/` holds code that shares this lockfile, which is what separates it
# from `tools/`.
#
# There are fourteen members, in three groups.
#
# `crates/dodo-app-icon`, `crates/dodo-i18n`, `crates/dodo-paths` and
# `crates/dodo-dialog-slot` are *kernel* crates: code many of dodo's modules
# use, lifted out so it can be depended on without depending on the rest of
# dodo — the icon set, the catalogue of every user-visible string, the rule for
# where dodo's files live, and the one-dialog-at-a-time slot. Two of the four
# have no dependencies at all. They deliberately do not depend on each other
# either: the graph is wide and shallow, because a chain of small crates compiles
# more slowly than one big one. `dodo-dialog-slot` is the one that had no
# choice: it works through a gpui `Global`, which is identified by its type, so
# a copy on each side of a crate boundary would be two unrelated slots — the
# same argument that put `t()` and the active-language global in `dodo-i18n`.
#
# The nine *feature* crates are whole app features: Cleaner, Docker, Database,
# API Explorer, updater, input method, JSON formatter and Encoder/Decoder were
# lifted out of the binary; `crates/dodo-flow` is the first that was *born* one,
# because by then the eight above were the reason to. The Cleaner set the shape:
# each crate owns one feature, and `main.rs` aliases it back to its old module
# name so neither side's call sites change. `AGENTS.md` records the extra seams
# the updater and input method needed, what the moves bought and what they did
# not — and is explicit that build speed was measured and is not among it.
#
# The last is `crates/dodo-ime-core`, the input method's pure engine, linked
# through the Input method feature crate.
#
# `default-members` names all fifteen packages (the root package and every crate), so a bare
# `cargo test` / `cargo clippy --all-targets` at the root covers each crate's own
# tests. **Adding a crate means adding it here in the same commit**; without it
# cargo defaults to the root package alone and the new crate's tests silently
# stop running. Platform bindings are target-gated, so another platform's
# check builds only the pure half.
#
# `exclude` names `tools/update-manifest` again at the workspace level: without
# it, building that crate through `--manifest-path` fails with "current package
# believes it's in a workspace when it's not", because a `[workspace]` table here
# claims every directory beneath it. It is spelled out rather than globbed —
# `workspace.exclude` matches paths, not patterns, so `tools/*` silently excludes
# nothing.
[workspace]
members = ["crates/*"]
default-members = [
    ".",
    "crates/dodo-api-explorer",
    "crates/dodo-app-icon",
    "crates/dodo-cleaner",
    "crates/dodo-database",
    "crates/dodo-dialog-slot",
    "crates/dodo-docker",
    "crates/dodo-encoder-decoder",
    "crates/dodo-flow",
    "crates/dodo-i18n",
    "crates/dodo-ime-core",
    "crates/dodo-input-method",
    "crates/dodo-json-formatter",
    "crates/dodo-paths",
    "crates/dodo-updater",
]
exclude = ["tools/update-manifest"]

[package]
name = "dodo"
version = "0.1.18"
edition = "2024"
# dodo's own source. It says nothing about the terms under which a *built*
# binary may be distributed — the dependency graph contains GPL-3.0-or-later
# crates that link into every build. THIRD-PARTY-NOTICES.md records which, and
# records that question as open.
license = "MIT"
default-run = "dodo"

# `tools/` holds release engineering that must never reach the application.
# `tools/update-manifest` is its own crate with its own Cargo.toml and
# Cargo.lock; this keeps it out of `cargo package` and out of the file set cargo
# watches for this package, so it costs the shipped binary zero bytes and the
# app's `test` / `clippy --all-targets` runs zero time. It is built only by the
# release workflow, which invokes it through `--manifest-path`.
exclude = ["tools/*"]

# Only features that switch real code off are listed here. `production` /
# `development` / `profiling` marker flags were considered and deliberately not
# added: nothing in this crate reads them, so they would be decorative — see
# `docs/build-optimization.md` for the same question about a `docker` feature,
# which is real but not worth the ~550 `Str` variants it would have to gate.
[features]
default = ["syntax-highlighting", "sql-highlighting"]
# The four tree-sitter grammars the code editor highlights with. Turning this
# off (`--no-default-features`) drops the grammar crates and their generated C
# parsers entirely and the editor falls back to plain, unhighlighted text —
# which is exactly what the library does when none of the features is set. It
# is the one lever in this crate that trades a visible feature for real binary
# size; `docs/build-optimization.md` records what it is worth.
syntax-highlighting = [
    "gpui-component/tree-sitter",
    "gpui-component/tree-sitter-html",
    "gpui-component/tree-sitter-yaml",
    # JavaScript, for the Scripts tab's two editors and the consent dialog's
    # read-only view of an imported script. Measured on its own in
    # `docs/build-optimization.md`; it is the only grammar here that colours
    # something the user *writes* rather than something a server sent.
    "gpui-component/tree-sitter-javascript",
]
# SQL, for the Database Explorer's query editor. **Its own feature, deliberately
# not folded into `syntax-highlighting` above**, because it is by far the most
# expensive thing in this crate's feature list and the trade has to stay visible
# and reversible: `tree-sitter-sequel`'s generated `parser.c` is 17.4 MB, and
# switching this on measures at roughly 6.8× what the JavaScript grammar costs —
# see the "SQL syntax highlighting" row in `docs/build-optimization.md` for the
# exact bytes and the comparison to `dprint-plugin-typescript`, which this
# project rejected at a similar price. Default on because the captain accepted
# the cost knowing the number; `--no-default-features` (or dropping just this
# one) leaves the query editor a plain code editor — gutter, selection,
# multi-cursor, search, soft wrap, no colour.
sql-highlighting = ["gpui-component/tree-sitter", "gpui-component/tree-sitter-sql"]

[dependencies]
# Every icon dodo draws, as one enum over `assets/icons`. Extracted with the
# rest of the kernel; `main.rs` aliases it back to `crate::app_icon` so the 39
# modules that name an `AppIcon` are untouched.
dodo-app-icon = { path = "crates/dodo-app-icon" }
# Where dodo writes its files, as a pure function of a platform and an
# environment. `main.rs`'s own `paths` module is the seam: it reads the one thing
# a pure crate cannot — the target triple `build.rs` embedded — and hands it over.
dodo-paths = { path = "crates/dodo-paths" }
# The single slot behind Settings' and the updater's dialogs. It used to be
# `src/dialog_slot.rs`; it had to become a crate the moment the updater left
# this binary, because the slot is a gpui `Global` and a `Global` is identified
# by its **type** — a copy on each side of the boundary would be two slots, and
# the two-identical-cards defect would come straight back. `main.rs` aliases it
# to `crate::dialog_slot`, so `settings.rs` is unchanged.
dodo-dialog-slot = { path = "crates/dodo-dialog-slot" }
# Every string dodo shows a user. The catalogue is reachable without `gpui` —
# a pure model holds a `Str` and a test renders it with no window — which is why
# the UI half (the gpui global, `Language::current` / `set`, `t()`) is behind the
# `gpui` feature this line switches on rather than in the crate proper. It used
# to be `src/i18n.rs`; it moved when `dodo-cleaner` needed to render a `Str`
# from outside this binary. `main.rs` aliases the crate to `crate::i18n`, so
# every call site is unchanged.
dodo-i18n = { path = "crates/dodo-i18n", features = ["gpui"] }
# The Cleaner, whole. The binary names exactly one item from it —
# `layout.rs`'s `CleanerView` — and `main.rs` aliases the crate back to
# `crate::cleaner`. See that crate's `lib.rs` for the seam.
dodo-cleaner = { path = "crates/dodo-cleaner" }
# The Docker/Podman tool, whole. The binary names three items from it —
# `layout.rs`'s `DockerPage` and `DockerView`, and `main.rs`'s `docker::init` —
# and `main.rs` aliases the crate back to `crate::docker`. `bollard`, `tokio`
# and `futures-util` went with it: this crate no longer names any of the three,
# and `docker::services` is still the only place in dodo that constructs a
# tokio runtime. See that crate's `lib.rs` for the seam.
dodo-docker = { path = "crates/dodo-docker" }
# The API Explorer, whole — the largest feature dodo has. The binary names
# five items from it: `layout.rs`'s `ApiExplorer`, `main.rs`'s
# `api_explorer::init`, `settings.rs`'s `ScriptPolicy` and
# `models::script_consent::ConsentPolicy` for the "Run scripts" row, and
# `quick_nav`'s `models::snapshot::RequestSnapshot` / `services::curl` for
# routing a pasted cURL command. `main.rs` aliases the crate back to
# `crate::api_explorer`. See that crate's `lib.rs` for the seam.
dodo-api-explorer = { path = "crates/dodo-api-explorer" }
# The Encoder/Decoder, whole. `layout.rs` names `Format` and the tool table
# names `EncoderDecoder`; this alias keeps both old module paths unchanged.
dodo-encoder-decoder = { path = "crates/dodo-encoder-decoder" }
# The JSON formatter, whole. The tool table is its only consumer.
dodo-json-formatter = { path = "crates/dodo-json-formatter" }
# The Flow Canvas, whole. The tool table names `FlowView`, and `main.rs` calls
# `flow::init` once for its canvas-scoped key bindings. Its document store stays
# inside the feature crate and resolves beneath the shared dodo data directory.
dodo-flow = { path = "crates/dodo-flow" }
# The Database Explorer, whole. The binary names four items from it —
# `layout.rs`'s `DatabaseView`, `main.rs`'s `database::init`, and
# `quick_nav`'s `models::uri` / `ParsedUri` for routing a pasted connection
# string — and `main.rs` aliases the crate back to `crate::database`. The four
# driver crates, `sqlformat` and the two rustls lines went with it. See that
# crate's `lib.rs` for the seam.
dodo-database = { path = "crates/dodo-database" }
# The in-app updater, whole. The binary names exactly two items from it —
# `layout.rs`'s `updater::open` and `main.rs`'s `updater::init` — and `main.rs`
# aliases the crate back to `crate::updater`. `reqwest` went with it and left
# this file entirely: the updater was its last consumer here. See that crate's
# `lib.rs` for the seam, and its `build_info` module for the one thing a
# library crate cannot be handed.
dodo-updater = { path = "crates/dodo-updater" }
# The input-method engine and shared language vocabulary. The feature crate's
# Event Tap and Keyboard Hook drive the engine; the tray uses the language IDs.
# See `crates/dodo-ime-core/src/lib.rs`.
dodo-ime-core = { path = "crates/dodo-ime-core" }
# dodo's Input method feature, whole — Event Tap, Keyboard Hook, persisted
# settings and the tool pane. The binary names four items: `layout.rs`'s `InputMethod`, `tools.rs`'s
# `views::InputMethodView`, and `main.rs`'s `init` / `load`. `main.rs` aliases
# the crate back to `crate::input_method`, and also hands it
# `tray::set_active_languages` — the one edge that pointed back into this
# binary. The AppKit/CoreGraphics and Win32 bindings went with it; the binary
# keeps its own copies of the ones `src/window_icon.rs`, `src/tray` and the
# Cleaner still name. See that crate's `lib.rs` for the seam.
dodo-input-method = { path = "crates/dodo-input-method" }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
# `tree-sitter` (JSON), `tree-sitter-html` and `tree-sitter-yaml` are what make
# the code editor actually colour text: without any of them the library's
# highlighter compiles to a stub that returns no highlights. Three grammars
# rather than the ~35 of `tree-sitter-languages`, chosen for what an HTTP
# response body actually is. Everything else degrades to plain text. They are
# selected through this crate's own `syntax-highlighting` feature (on by
# default) rather than listed here, so a size-constrained build can drop them.
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
anyhow = "1.0"
# No `reqwest` here any more. This crate had it for `updater::services` alone
# once `api_explorer::services::http` left, and the updater has now left too —
# so the two crates that declare the identical line, `dodo-api-explorer` and
# `dodo-updater`, are the whole of dodo's HTTP surface, and this binary names
# no HTTP client at all. It is the same shape `bollard` and `tokio` took when
# Docker left: a feature crate takes its outside-world dependencies with it.
rust-embed = "8.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Reads macOS app-bundle Info.plist files and Mail metadata conservatively.
plist = "1"
# Quick navigation's Base64 detector. The Encoder/Decoder and API Explorer
# crates declare the same line; all three resolve to one package.
base64 = "0.22.1"
nucleo-matcher = "0.3"
unicode-normalization = "0.1"
# Quick navigation's user-editable detector patterns. **This adds no crate to
# the graph**: `gpui` and `gpui-component` already depend on `regex 1`, so this
# only promotes an existing transitive dependency to a direct one. It is also
# the only regex engine here with no backtracking — matching is linear in the
# input — which is what makes it safe to run an untrusted, user-typed pattern
# from a key handler. `default-features = false` off the `perf` and `unicode`
# extras would only rebuild it a second way; the versions must resolve to one
# package, so the features stay at the default the other two already select.
regex = "1"
# The `Stream` adaptors `tray::mod` and `input_method::mod` await their
# `futures-channel` receivers with. It used to be here for `docker::services`
# too; that use went to `crates/dodo-docker`, which declares it itself, and
# these two kept the line. **This adds no crate to the graph**: `gpui` already
# depends on `futures-util` 0.3.
futures-util = "0.3.33"
# The `Send + Sync` sender half that carries macOS menu-bar events out of an
# AppKit callback and into a GPUI foreground task — see `src/tray/mod.rs`, which
# is the only module that may name it. `tray-icon`'s event handlers are
# `Fn + Send + Sync`, so they cannot capture GPUI's `AsyncApp` (its
# `ForegroundExecutor` is `!Send` by construction); an unbounded mpsc is the
# seam, and awaiting the receiver in one long-lived task is what makes delivery
# event-driven rather than polled.
#
# **This adds no crate to the graph**, the same argument `regex` above makes:
# `gpui` already depends on `futures-channel` 0.3 — `AsyncApp` itself uses
# `futures::channel::oneshot` — so this only promotes an existing transitive
# dependency to a direct one. Not target-scoped even though only the macOS tray
# uses it today, because Windows and Linux tray support would use the same seam
# and a `cfg` here would have to be removed again.
futures-channel = "0.3"


# Two kernel32 calls only — `GetStdHandle` and `AttachConsole` — so that
# `--version` / `--build-info` still print from a GUI-subsystem binary. See
# `attach_parent_console` in `src/main.rs` for why that is needed. This is a
# target-gated dependency: it adds nothing to a macOS or Linux build, and the
# version is one already in the graph, so it costs no extra crate. Prefer
# adding a feature here over hand-declaring an `extern "system"` signature —
# this host cannot compile the Windows target, so the signatures need to come
# from something the Windows compiler will check.
# AppKit, for exactly one call: `-[NSApplication setApplicationIconImage:]` in
# `src/window_icon.rs`, which is what gives a *directly run* macOS binary
# dodo's Dock icon. A bundled .app needs none of this — it has an Info.plist —
# and GPUI exposes no dock-icon API at all (`WindowOptions::icon` is X11 only),
# so a platform call is the only route.
#
# **Neither crate is new to the graph**: both versions are exactly what
# `gpui_macos` already depends on, so this adds no package to `Cargo.lock` and
# nothing new to compile beyond the two class modules the features below switch
# on. Features are additive across a graph, so listing only what this call
# needs is the whole cost. `NSResponder` is not decoration — it is
# `NSApplication`'s superclass, and objc2's generated bindings will not compile
# a class whose superclass feature is off.
#
# The typed bindings are preferred over `objc`'s raw `msg_send!` for the reason
# already stated for `windows-sys` below: a checked signature beats a
# hand-written one, especially for a call nobody here can run in CI.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSImage",
    "NSResponder",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSData"] }

# Cleaner's Universal Binaries scanner (Phase 14, analysis-only): reads a
# Mach-O executable's fat-header architecture list without executing it or
# shelling out to `lipo`/`file`. `read` is the only capability this needs
# (no `write`, since this phase never mutates a binary); `macho` narrows the
# format support to what Cleaner actually inspects.
object = { version = "0.39", default-features = false, features = [
    "read",
    "macho",
] }
# The macOS menu bar item and Windows notification-area icon. Only `src/tray`
# may name this crate; its native event loop integration is what lets one tray
# implementation serve both platforms without a helper process.
#
# `default-features = false` keeps the Linux GTK/libxdo backend out of both
# builds. No package is added: this dependency was already locked for macOS.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }

# Decodes the embedded 256px PNG into the RGBA buffer GPUI's X11 backend writes
# into `_NET_WM_ICON` (`WindowOptions::icon`, which is X11-only). Scoped to
# Linux because that is the only `cfg` that names the type: `src/main.rs` sets
# the field inside a `#[cfg(target_os = "linux")]` block precisely so that a
# macOS or Windows build never has to name `image` at all.
#
# Not a new package either — `gpui` already depends on `image` 0.25 with `png`
# among its formats, so this resolves to the crate and the feature already in
# the graph and compiles nothing extra.
[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Cleaner's move-to-trash for Windows and Linux (`cleaner::windows::platform`,
# `cleaner::linux::platform`). macOS keeps its existing direct
# `NSFileManager` call in `cleaner::macos::platform::trash` rather than being
# switched to this too — it already shipped and is already tested, and
# `trash` would buy it nothing it does not already have. On Windows this
# drives `IFileOperation`; on Linux it implements the freedesktop.org Trash
# spec (`$XDG_DATA_HOME/Trash`) itself, in pure Rust — no `pkg-config`, no
# GTK/D-Bus dependency, so it costs the Linux build nothing beyond the crate.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
trash = "5.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    # `MessageBeep`, which Windows declares here rather than beside the message
    # box constants it takes. Keyboard Hook uses the system sound for the
    # language-switch beep.
    "Win32_System_Diagnostics_Debug",
    # Cleaner AI Apps uses a read-only process snapshot for conservative
    # running-app detection; this adds no new package to the graph.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Embeds the `RT_GROUP_ICON` resource that makes Explorer and the taskbar show
# `assets/windows/dodo.ico` for `dodo.exe` itself; see the `#[cfg(windows)]`
# block at the end of `build.rs`. Target-scoped, and that word is load-bearing
# in a way worth stating: cargo evaluates a `[target.…]` **build**-dependency
# against the *target*, not the host (rust-lang/cargo#4932), so this crate is
# in the graph exactly when something is being built for Windows and a macOS or
# Linux build never compiles it. Verified with
# `cargo tree -e build --target <triple>`; the recorded result is in
# "Windows icon: embedded" in `docs/release.md`.
#
# `default-features = false` drops the `toml` feature. Its only job is to read
# an optional `[package.metadata.winresource]` table out of this file and merge
# it into the VERSIONINFO block; dodo has no such table, so the feature buys
# nothing and costs a `toml` + `serde` build subtree — plus a
# `parse_cargo_toml(...).unwrap()` inside `WindowsResource::new` that only
# exists while it is on. The VERSIONINFO dodo does get (ProductName,
# FileDescription, FileVersion, ProductVersion) comes from `CARGO_PKG_*`, which
# needs no features at all.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }

# ---------------------------------------------------------------------------
# Build profiles
#
# `docs/build-optimization.md` carries the measurements these settings are
# based on (all taken on macOS arm64) and the reasoning that is too long for a
# comment. Keep the two in sync when changing anything here.
# ---------------------------------------------------------------------------

# What ships. Every release archive is built with this profile plus `--locked`.
[profile.release]
opt-level = 3
# Fat LTO rather than the usual "thin" default advice, because it was measured
# on this graph rather than assumed: fat produced a 20,513,488-byte binary
# against thin's 22,370,896 (-8.3%) for 5m42s against 4m29s of clean build
# time, with a 2.3 GiB peak RSS in the link step — well inside a CI runner.
# 73 seconds on a build that happens once per tag is a good trade for 1.8 MB
# off every download. Runtime performance was NOT benchmarked either way.
lto = "fat"
# One codegen unit per crate: strictly better optimisation input than the
# default 16, and the wall-clock cost is small next to LTO.
codegen-units = 1
# The shipped binary carries no symbol table. This is the deliberate other half
# of the crash-symbolication story: build `release-debug` below when you need a
# symbolicated stack, and see section "Crash reporting" in `docs/release.md`
# for how a `.dSYM` would be produced and uploaded once that exists.
strip = "symbols"
# No debug info to strip in the first place; keeps LTO input small.
debug = false
# Incremental compilation exists to make *rebuilds* cheap by splitting code
# into more units. A release build is built once, from clean, in CI — the split
# would only cost optimisation quality.
incremental = false
# Release builds wrap on integer overflow (the Rust default for `release`).
# Stated explicitly because the alternative is a runtime panic in a GUI app
# with unsaved state; dodo's arithmetic is UI layout and byte counts, not
# anything where a wrap is a security boundary.
overflow-checks = false
# NOT `panic = "abort"`, against the baseline this profile started from — and
# this one is a genuinely close call, so read `docs/build-optimization.md`
# before changing it. `abort` was built and launched: it works, and it is worth
# 3.5 MB (17,040,784 bytes vs 20,513,488, -16.9%) and 76 seconds of build time.
# What it costs is failure isolation. dodo runs fallible work — HTTP requests,
# Docker API polling, collection files — on GPUI background threads and inside
# a tokio runtime whose task harness wraps every poll in `catch_unwind`. Today
# a panic there kills one task; with `abort` it SIGABRTs a GUI app holding
# unsaved editor state. That failure path is the part no local test can verify,
# which is exactly why the smaller binary does not win.
panic = "unwind"

# A release build you can profile or symbolicate: same optimisation as
# `release`, plus full debug info kept out of the executable itself. On macOS
# `packed` runs `dsymutil`, producing `target/release-debug/dodo.dSYM` (277 MB,
# same UUID as the binary — that pairing is what a symbol server needs). Not
# what ships, and not cheap: 11m 46s clean, so reach for it deliberately.
# `cargo dist-debug` is the alias.
[profile.release-debug]
inherits = "release"
debug = "full"
split-debuginfo = "packed"
strip = "none"
