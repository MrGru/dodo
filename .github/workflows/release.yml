# Release: turn a `v*` tag into published, checksummed, verified archives.
#
#   tag pushed
#      │
#      ├─ meta      validate the tag against Cargo.toml, pin SOURCE_DATE_EPOCH
#      │
#      ├─ build     one job per platform: build → package → verify → upload
#      │
#      └─ publish   collect artifacts, generate update.json + SHA256SUMS
#                    (failing on any missing platform), create or update the
#                    Release
#
# Everything a human has to do is in docs/release.md. The two rules encoded
# here that are easy to get wrong by hand:
#
#   * `--locked` on every cargo invocation. Cargo.lock is the only thing
#     pinning the four git dependencies (gpui/gpui_platform from zed,
#     gpui-component/-assets); without it a release could silently be built
#     against a different upstream commit than the one that was tested.
#   * `SOURCE_DATE_EPOCH` is the tagged commit's own committer timestamp, not
#     "now", so re-running this workflow for the same tag embeds the same
#     build_time. See "Reproducibility" in docs/build-optimization.md for what
#     that does and does not buy.
#
# Release run 31655518790 built, packaged, verified and published all four
# targets. That is artifact evidence only: GUI behaviour, native-host install
# and typing still require captain runtime checks on each platform.

name: Release

on:
  push:
    tags:
      # v1.2.3, and pre-releases like v1.2.3-rc.1.
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Lets you exercise the whole pipeline on a branch without tagging: it
  # builds, packages and verifies, and stops before publishing.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without creating a GitHub Release.
        type: boolean
        default: true

# A tag is immutable; two concurrent runs for one tag would race on the same
# Release object.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Everything the later jobs need to agree on, computed once.
  # ---------------------------------------------------------------------------
  meta:
    name: resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      source_date_epoch: ${{ steps.resolve.outputs.source_date_epoch }}
      publish: ${{ steps.resolve.outputs.publish }}
      macos_signed: ${{ steps.resolve.outputs.macos_signed }}
    env:
      # Read here, at job level, because the `secrets` context is not available
      # in any `if:` — see the signing steps in the build job below. The publish
      # job needs the answer for the release notes, and a matrix job's outputs
      # cannot give it one (four rows, one output slot), so it is resolved once
      # in this job and passed down.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      # Full history: `git log` on the tagged commit needs the commit object,
      # and a default shallow checkout of a tag does not always carry it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: resolve
        shell: bash
        run: |
          set -euo pipefail

          # Version according to the crate — the single source of truth for
          # archive names and for what `dodo --version` will print.
          version="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{gsub(/[",]/,"",$3); print $3; exit}' Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            # A tag that disagrees with Cargo.toml would produce archives named
            # after one version containing a binary that reports another. Fail
            # here, before anything is built.
            if [ "$tag" != "v$version" ]; then
              echo "::error::tag $tag does not match Cargo.toml version $version (expected v$version)"
              exit 1
            fi
            # Anything after the patch number (-rc.1, -beta) marks a
            # pre-release, per semver.
            case "$tag" in
              v[0-9]*.[0-9]*.[0-9]*-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "publish=${{ github.event_name == 'push' }}" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch on a branch: build the pipeline, name the
            # archives after the crate version, never publish.
            tag="v$version"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # The committer timestamp of the commit being released. Using this
          # rather than the current time is what makes a re-run of the same tag
          # embed the same build_time (build.rs honours SOURCE_DATE_EPOCH).
          epoch="$(git log -1 --pretty=%ct)"
          echo "source_date_epoch=$epoch" >> "$GITHUB_OUTPUT"

          # Whether the macOS archives in this run will be Developer ID signed,
          # notarised and stapled. Only the presence of the certificate secret
          # is knowable here; the build job fails hard if the rest of the set is
          # incomplete, so "the secret exists" and "the artifacts are signed"
          # cannot diverge in a run that reaches publish. A fork has no secret
          # and gets `false`, which is what keeps its release notes truthful.
          if [ -n "${MACOS_CERTIFICATE:-}" ]; then
            echo "macos_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos_signed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "releasing $tag (version $version, epoch $epoch)"

  # ---------------------------------------------------------------------------
  # Build, package and verify — once per platform, on its own runner.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: meta
    runs-on: ${{ matrix.os }}
    # Same honesty as ci.yml: only macos-arm64 has ever been produced by hand.
    # `continue-on-error` lets an experimental platform fail without cancelling
    # the others, so the run still collects everything that did build. It no
    # longer means such a failure is survivable: the publish job's manifest step
    # fails the release for any missing platform, experimental included. See
    # "Automatic updates" in docs/release.md for why that is the right default.
    continue-on-error: ${{ matrix.experimental }}
    # There was no explicit timeout here before, so the job ran under GitHub's
    # 6-hour default. It is written out now because the macOS rows block on
    # `xcrun notarytool submit --wait`, which typically returns in minutes but
    # has no documented upper bound — this is the ceiling that has to
    # accommodate it, and 360 is the maximum a hosted job may ask for. Do not
    # tighten it to "how long a build takes" without accounting for the notary.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            experimental: false
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            experimental: true
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            experimental: true
          - name: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            experimental: true
    env:
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source_date_epoch }}
      # macOS signing and notarisation. These are read at JOB level because the
      # `secrets` context is not available in `jobs.<id>.if` or in
      # `jobs.<id>.steps.if` — it is available in `env:`, and `env` is available
      # in `steps.if`, which is what makes `env.MACOS_CERTIFICATE != ''` below a
      # working guard (docs/macos-signing.md §2.2). All six are absent on a fork
      # and in any clone without them, and every step that uses them is guarded,
      # so the unsigned path stays exactly as it was.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_API_KEY: ${{ secrets.MACOS_NOTARY_API_KEY }}
      MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
      MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # build.rs reads git for the commit and tag. It falls back to the
          # GITHUB_* variables, but full history keeps `git describe` honest.
          fetch-depth: 0

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-deps

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          # Deliberately a different cache namespace from CI's build jobs:
          # release builds are rarer, and should not be evicted by PR traffic.
          cache-key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # --- signing -----------------------------------------------------------
      #
      # This step is the ONLY signing-related thing the workflow does. The
      # codesign / notarytool / stapler calls themselves live inside
      # scripts/package.sh and scripts/macos-app-bundle.sh, because they have to
      # happen before the tar and its checksum — a signature added between
      # packaging and upload would not be in the published archive at all
      # (docs/macos-signing.md §4.1, constraint 3).
      #
      # What is left here is the part only a runner needs: a keychain that
      # exists for this job and is destroyed with it.
      - name: Set up signing keychain (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail

          # Half a credential set produces failures that look like something
          # else — an identity that codesign cannot resolve, or an
          # authentication error notarytool will not attribute. Fail here, with
          # the name of the missing secret, before anything is signed.
          for required in MACOS_CERTIFICATE_PWD MACOS_NOTARY_TEAM_ID \
                          MACOS_NOTARY_API_KEY MACOS_NOTARY_API_KEY_ID \
                          MACOS_NOTARY_API_ISSUER_ID; do
            if [ -z "${!required:-}" ]; then
              echo "::error::MACOS_CERTIFICATE is set but $required is not; set all six or none"
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/dodo-signing.keychain-db"
          # Not a secret: this keychain exists for one job on one ephemeral
          # runner and dies with it, so a generated password is strictly better
          # than a stored one (docs/macos-signing.md §2).
          keychain_pwd="$(uuidgen)"
          cert="$RUNNER_TEMP/dodo-cert.p12"
          key="$RUNNER_TEMP/dodo-notary-key.p8"

          security create-keychain -p "$keychain_pwd" "$keychain"
          # Without this the keychain re-locks after 5 minutes of inactivity and
          # a later codesign fails halfway through the job with an opaque error.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pwd" "$keychain"

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$cert"
          security import "$cert" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          rm -f "$cert"

          # THE STEP EVERYONE FORGETS. Without it macOS wants to show a
          # "codesign wants to use the key … allow?" dialog. A runner has no one
          # to click it, so codesign blocks and then fails with
          # errSecInternalComponent, which says nothing about the cause.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_pwd" "$keychain" >/dev/null

          # codesign searches the search LIST, not a path. Prepending is what
          # makes the imported identity findable; keeping login.keychain-db on
          # the list avoids surprising other tools in the job.
          security list-keychain -d user -s "$keychain" login.keychain-db

          # Counted, not printed: the identity's common name is the certificate
          # holder's legal name. It is public anyway (it is in every signed
          # binary), but there is no reason for this log to be where it appears.
          found="$(security find-identity -v -p codesigning "$keychain" \
                   | grep -c 'Developer ID Application' || true)"
          echo "Developer ID Application identities in the temporary keychain: $found"
          if [ "$found" -lt 1 ]; then
            echo "::error::no Developer ID Application identity in the imported .p12"
            exit 1
          fi

          # The App Store Connect API key, as a file, because notarytool takes a
          # path rather than a value. Deleted by the cleanup step below, in this
          # same job, whether the job passed or failed.
          printf '%s' "$MACOS_NOTARY_API_KEY" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "MACOS_NOTARY_KEY_PATH=$key" >> "$GITHUB_ENV"

      # --- packaging ---------------------------------------------------------
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          args=(--target "${{ matrix.target }}" --version "${{ needs.meta.outputs.version }}")
          # The .app bundle is macOS-only and is a second archive, not a
          # replacement for the plain binary one.
          if [ "${{ runner.os }}" = "macOS" ]; then
            args+=(--app-bundle)
            # MACOS_NOTARY_KEY_PATH is set only by the keychain step above, so
            # this is on exactly when that step ran. Without it package.sh
            # ad-hoc signs, which is the unsigned path a fork takes.
            #
            # The Team ID is enough for --sign: codesign resolves it as long as
            # exactly one matching identity is on the search list, which is
            # exactly the situation on a freshly created temporary keychain. So
            # there is no separate identity secret to keep in step with a
            # certificate rename.
            if [ -n "${MACOS_NOTARY_KEY_PATH:-}" ]; then
              args+=(--sign "$MACOS_NOTARY_TEAM_ID"
                     --notary-key "$MACOS_NOTARY_KEY_PATH"
                     --notary-key-id "$MACOS_NOTARY_API_KEY_ID"
                     --notary-issuer "$MACOS_NOTARY_API_ISSUER_ID")
            fi
          fi
          scripts/package.sh "${args[@]}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh scripts/package.ps1 `
            -Target "${{ matrix.target }}" `
            -Version "${{ needs.meta.outputs.version }}"

      # --- verification ------------------------------------------------------
      #
      # Section 10's "release verification" in one place: the archive unpacks,
      # keeps its executable bit, contains a binary that runs, reports the
      # version and tag we think it does, was built from a clean checkout, and
      # its SHA256 sidecar matches. `verify-release.sh` prints the contents and
      # both sizes as it goes, so the log is the record of what shipped.
      - name: Verify archives (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for archive in dist/*.tar.gz; do
            scripts/verify-release.sh "$archive" \
              --expect-version "${{ needs.meta.outputs.version }}" \
              --expect-tag "${{ needs.meta.outputs.tag }}"
          done

      # The bash script is not reused here: a windows runner has no `unzip`,
      # and Expand-Archive/Get-FileHash are the native equivalents. Kept
      # deliberately short — it checks the same five things.
      #
      # `--build-info` is run through `Start-Process -Wait` rather than the `&`
      # call operator, and that is the whole reason v0.1.5 shipped with no
      # Windows archive. A release build is a GUI-subsystem binary (the
      # `windows_subsystem` attribute in `src/main.rs`), and **a shell does not
      # wait for a GUI-subsystem process** — `src/main.rs`'s own doc comment on
      # `attach_parent_console` says so. So `&` returned immediately, PowerShell
      # tore down the capture pipe, and the child then panicked writing into it:
      #
      #     failed printing to stdout: The pipe is being closed. (os error 232)
      #
      # `$info` was left empty and the next line threw on a null. Evidence: run
      # 30539731759 attempt 1, job 90861436501 — the step failed, its upload step
      # was skipped, and the release published without Windows.
      #
      # `Start-Process -Wait` waits regardless of subsystem, and
      # `-RedirectStandardOutput` hands the child a real file handle, so
      # `attach_parent_console` correctly leaves it alone. The two guards below
      # are what make a future regression legible instead of silent.
      #
      # This passed on Windows in release run 31655518790. See "Checking a
      # Windows fix without a Windows machine" in docs/release.md for the
      # narrower checks available from a Mac.
      - name: Verify archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Get-ChildItem dist\*.zip | Select-Object -First 1
          Write-Output "verifying $($archive.Name)"

          # 1. checksum sidecar
          $expected = (Get-Content "$($archive.FullName).sha256").Split(" ")[0]
          $actual = (Get-FileHash -Algorithm SHA256 $archive.FullName).Hash.ToLower()
          if ($expected -ne $actual) { throw "SHA256 mismatch for $($archive.Name)" }

          # 2. contents
          $dest = Join-Path $env:RUNNER_TEMP "verify"
          Expand-Archive -Path $archive.FullName -DestinationPath $dest -Force
          Get-ChildItem -Recurse $dest | ForEach-Object { Write-Output "  $($_.FullName)" }

          # 3/4. exact package layout, then executable metadata
          $root = Join-Path $dest ([IO.Path]::GetFileNameWithoutExtension($archive.Name))
          $exe = Get-Item (Join-Path $root "dodo.exe") -ErrorAction SilentlyContinue
          if (-not $exe) { throw "no dodo.exe at the archive root" }
          $tsf = Get-Item (Join-Path $root "input-method\dodo_ime_windows.dll") -ErrorAction SilentlyContinue
          if (-not $tsf) { throw "no Windows TSF host DLL at input-method/dodo_ime_windows.dll" }

          $infoFile = Join-Path $env:RUNNER_TEMP "build-info.txt"
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList '--build-info' `
            -RedirectStandardOutput $infoFile -NoNewWindow -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "--build-info exited $($proc.ExitCode)" }
          $info = Get-Content $infoFile
          if (-not $info) { throw "--build-info printed nothing" }
          Write-Output $info
          $version = ($info | Select-String '^version:').ToString().Split()[-1]
          if ($version -ne "${{ needs.meta.outputs.version }}") {
            throw "version mismatch: binary says $version"
          }
          if ($info | Select-String '^commit: *unknown') { throw "commit is unknown" }
          if ($info | Select-String -- '-dirty') { throw "built from a dirty tree" }

          # 5. size
          Write-Output "archive size: $($archive.Length) bytes"
          Write-Output "sha256: $actual"

      # Windows signing is still future work, and is the same shape in
      # scripts/package.ps1: sign the .exe before zipping it, for the same
      # reason the macOS signing sits before the tar.

      - name: Upload archives
        uses: actions/upload-artifact@v7
        with:
          name: dodo-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

      # `always()`, because the whole point is that a failed build does not
      # leave a decoded certificate or notarisation key on the runner. The
      # .p12 is already gone — it is removed the moment it is imported — so this
      # is the .p8, the keychain, and putting the search list back.
      - name: Remove signing credentials (macOS)
        if: always() && runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/dodo-cert.p12" "$RUNNER_TEMP/dodo-notary-key.p8"
          security delete-keychain "$RUNNER_TEMP/dodo-signing.keychain-db" || true
          security list-keychain -d user -s login.keychain-db || true

  # ---------------------------------------------------------------------------
  # Assemble, check, publish.
  #
  # This job runs on a dry run too, and stops before the publishing step. That
  # is deliberate: the manifest generator is what enforces the complete platform
  # set, so gating the whole job on `publish` would mean the check every release
  # depends on could only ever run during a real release. A `workflow_dispatch`
  # rehearsal now exercises it — and goes red for a missing platform — without
  # touching a Release.
  #
  # It no longer "publishes exactly the artifacts that arrived": an experimental
  # platform failing used to be silently absent from the release, and now fails
  # it. See "Automatic updates" in docs/release.md for that argument.
  # ---------------------------------------------------------------------------
  publish:
    name: publish release
    needs: [meta, build]
    # `needs.build.result` is `success` when every non-`continue-on-error`
    # matrix row passed — an experimental platform failing does not block the
    # job from starting, a failing macOS build does. The missing-platform check
    # itself lives in the generator step below, which sees what actually
    # arrived rather than which rows were allowed to fail.
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # The only place in either workflow that needs write access.
      contents: write
    steps:
      - uses: actions/checkout@v7

      # `digest-mismatch` defaults to `error` from v8 on — a downloaded archive
      # whose hash does not match what the server recorded now fails the release
      # rather than logging a warning. That is the behaviour this job wants: a
      # corrupted archive must never reach a published Release.
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Re-check the merged downloads rather than trusting that the artifact
      # uploaded by each matrix row is the one its earlier verification saw.
      # This contents-only pass is intentionally before manifest generation and
      # publication; the Linux runner cannot execute or codesign-check every
      # target, while each platform row already did those host-specific checks.
      - name: Verify downloaded package contents
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(artifacts/*.tar.gz artifacts/*.zip)
          [ "${#archives[@]}" -gt 0 ] || { echo "::error::no downloaded archives"; exit 1; }
          for archive in "${archives[@]}"; do
            scripts/verify-release.sh "$archive" --skip-execution
          done

      # Rust here is only for `tools/update-manifest`: four small dependencies
      # and its own Cargo.lock, none of dodo's graph. Its own cache namespace so
      # a publish job can never evict a release build's entry.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: update-manifest

      # The notes are written once, to a file, because two consumers now need
      # exactly the same text: the GitHub Release body and the manifest's
      # `notes` field. Generating them twice would let them drift.
      - name: Write release notes
        id: notes
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          # Resolved once in the `meta` job. The macOS paragraph is the one
          # piece of the notes that depends on how the run was configured, and
          # getting it wrong is worse than saying nothing: telling a user to
          # clear quarantine on a notarised app is noise, and NOT telling them
          # on an unsigned one is a download that will not open.
          MACOS_SIGNED: ${{ needs.meta.outputs.macos_signed }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "## dodo ${TAG}"
            echo
            echo "### Verifying a download"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS   # or: shasum -a 256 -c SHA256SUMS"
            echo '```'
            echo
            echo "Every archive also ships its own \`.sha256\` sidecar."
            echo
            echo "### macOS"
            echo
            if [ "${MACOS_SIGNED:-false}" = "true" ]; then
              echo "\`dodo.app\` is **code-signed with a Developer ID certificate, notarised by"
              echo "Apple and stapled**, so it opens straight from Finder — no Gatekeeper"
              echo "prompt and no \`xattr\` incantation."
              echo
              echo "The plain \`-macos-\` archive (the bare binary, for terminal users) is signed"
              echo "and notarised too, but a bare executable is not a format a notarisation"
              echo "ticket can be stapled to, so Gatekeeper checks it against Apple online the"
              echo "first time it runs."
              echo
              echo "Check what you downloaded:"
              echo
              echo '```sh'
              echo "codesign -dvvv dodo.app        # identity, team, hardened runtime"
              echo "spctl --assess --type execute -v dodo.app"
              echo "xcrun stapler validate dodo.app"
              echo '```'
              echo
            else
              echo "The binaries in this build are **not code-signed or notarised**, so"
              echo "Gatekeeper will quarantine them. Clear it with:"
              echo
              echo '```sh'
              echo "xattr -dr com.apple.quarantine dodo.app   # or the extracted binary"
              echo '```'
              echo
            fi
            echo "### Build provenance"
            echo
            echo "Run \`dodo --build-info\` — every binary records the commit, tag,"
            echo "build time, target and rustc version it was produced from."
          } > "$notes_file"

          echo "path=$notes_file" >> "$GITHUB_OUTPUT"
          echo "--- release notes ---"
          cat "$notes_file"

      # The gate this whole round exists for.
      #
      # Every platform is passed as `--expect-platform`, including the three
      # that are `experimental: true` in the build matrix. A `continue-on-error`
      # platform failing does not fail the `build` job, so without this the
      # publish job cheerfully ships a release with a platform missing — which
      # is exactly what happened to v0.1.5 (no Windows archive, and no signal
      # anywhere that one was expected). A missing platform now fails the run
      # here, before anything is published. `docs/release.md` argues why the
      # block covers experimental platforms too, and what to do when the block
      # is the wrong answer for a particular release.
      #
      # The generator also writes SHA256SUMS, replacing the `cat ./*.sha256`
      # that used to live here: it hashes every archive itself and cross-checks
      # each one against its sidecar, so a corrupted upload fails here rather
      # than reaching a user.
      #
      # `published_at` is derived from SOURCE_DATE_EPOCH — the tagged commit's
      # own timestamp — rather than "now", for the same reason the builds are:
      # re-running this job for the same tag must produce a byte-identical
      # manifest, not a second document that differs only in a timestamp.
      - name: Generate update.json and SHA256SUMS
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
          EPOCH: ${{ needs.meta.outputs.source_date_epoch }}
          NOTES: ${{ steps.notes.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          published_at="$(date -u -d "@${EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"

          cargo run --release --locked \
            --manifest-path tools/update-manifest/Cargo.toml -- \
            --version "$VERSION" \
            --channel stable \
            --dir artifacts \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "$TAG" \
            --notes-file "$NOTES" \
            --published-at "$published_at" \
            --out artifacts/update.json \
            --sums-out artifacts/SHA256SUMS \
            --expect-platform macos-arm64 \
            --expect-platform macos-x64 \
            --expect-platform linux-x64 \
            --expect-platform windows-x64

          echo "--- update.json ---"
          cat artifacts/update.json
          echo "--- SHA256SUMS ---"
          cat artifacts/SHA256SUMS
          # Independent of the generator: prove the file it wrote actually
          # verifies with the tool the release notes tell users to run.
          (cd artifacts && sha256sum -c SHA256SUMS)

      # Create or update, never just create.
      #
      # `gh release create` fails with "a release with the same tag name already
      # exists" if anything already published the tag, so a partially-published
      # release could not be repaired by re-running — and this project treats
      # tags as immutable, so deleting and re-tagging is not an option either.
      # That is not hypothetical: v0.1.5's attempt 1 published successfully and
      # the re-run (attempt 2, job 90886356082) died on exactly this.
      #
      # `--verify-tag` stays on the create path, where it belongs: it refuses to
      # invent a tag that does not exist. `--clobber` on upload replaces assets
      # of the same name rather than erroring, which is what makes a re-run
      # converge on the intended state instead of half-failing.
      - name: Publish GitHub Release
        # The one step a dry run must not take. Everything above it — download,
        # manifest generation, the platform gate, the checksum verification —
        # runs either way.
        if: ${{ needs.meta.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          NOTES: ${{ steps.notes.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — updating it in place"
            flags=(--title "dodo ${TAG}" --notes-file "$NOTES")
            # `edit` needs the flag stated in both directions; `create` only
            # ever adds it. Written out so the two paths cannot disagree about
            # what a non-pre-release means.
            if [ "$PRERELEASE" = "true" ]; then
              flags+=(--prerelease)
            else
              flags+=(--prerelease=false)
            fi
            gh release edit "$TAG" "${flags[@]}"
            gh release upload "$TAG" artifacts/* --clobber
          else
            echo "creating release $TAG"
            flags=(--title "dodo ${TAG}" --notes-file "$NOTES")
            # Spelled as an `if` rather than `[ ... ] && flags+=(...)`: under
            # `set -e` that idiom is only safe while another command follows it,
            # which is the kind of thing an edit quietly breaks.
            if [ "$PRERELEASE" = "true" ]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" "${flags[@]}" --verify-tag artifacts/*
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Released ${{ needs.meta.outputs.tag }}"
            echo
            echo '| asset | bytes |'
            echo '|---|---|'
            for f in artifacts/*; do
              printf '| %s | %s |\n' "$(basename "$f")" "$(wc -c < "$f" | tr -d ' ')"
            done
          } >> "$GITHUB_STEP_SUMMARY"
